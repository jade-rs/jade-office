<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jade office · 共同編集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceef3;color:#24242b;font:14px -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}button,a{font:inherit}header{background:#191923;color:#fff;padding:15px 28px;display:flex;align-items:center;gap:16px}header strong{font-size:21px;letter-spacing:-.7px}header span{color:#b9b9c9}.grow{flex:1}button,.download{border:1px solid #d8d8e2;background:white;color:#35354a;border-radius:7px;padding:8px 12px;cursor:pointer;text-decoration:none}button:hover,.download:hover{background:#eeeef8}header button{border-color:#555567;background:#303041;color:white}header button:hover{background:#45455c}.bar{display:flex;gap:14px;align-items:center;padding:13px 28px;background:white;border-bottom:1px solid #e1e1e8;flex-wrap:wrap}#status{color:#4f46e5;font-weight:600}#notice{padding:10px 28px;background:#fff4d6;white-space:pre-wrap}#notice:empty{display:none}.who{background:#eef2ff;color:#4f46e5;padding:5px 9px;border-radius:20px}#peers{font-size:12px;color:#666}.tools{display:flex;gap:22px;align-items:center;padding:10px 28px;background:#fafaff;color:#73738b;border-bottom:1px solid #d9dbe5;font-size:12px}.tools strong{color:#44445c}#editor{position:relative;padding:30px 24px 50px;min-height:70vh;overflow:auto;touch-action:none;user-select:none;cursor:text;outline:none}#editor .page{position:relative;background:#fff;margin:0 auto 24px;box-shadow:0 4px 22px #20203020}canvas{display:block}.selection{position:absolute;background:#767aff55;pointer-events:none}.caret{position:absolute;background:#4f46e5;pointer-events:none;display:none}#editor.focused .caret{display:block;animation:blink 1.1s step-end infinite}#editor[data-composing=true] .caret{animation:none}#ime{position:absolute;width:2px;min-height:16px;overflow:hidden;outline:none;white-space:pre;opacity:.01;caret-color:transparent;color:transparent;z-index:2;font:16px/1 sans-serif}footer{padding:0 28px 24px;color:#73738b;font-size:12px;line-height:1.8}#loading{text-align:center;padding:80px;color:#74748b}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){#editor.focused .caret{animation:none}}
.peer-caret{position:absolute;background:var(--peer-color);pointer-events:none;z-index:4}.peer-selection{position:absolute;background:var(--peer-color);opacity:.2;pointer-events:none;z-index:3}.peer-name{position:absolute;left:-2px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;background:var(--peer-color);color:white;border-radius:3px 3px 3px 0;padding:2px 5px;font:12px/15px -apple-system,sans-serif}.peer-chip{border-color:var(--peer-color);color:var(--peer-color);background:transparent;padding:4px 8px;font-size:12px;border-radius:20px}#peers{display:flex;flex-wrap:wrap;gap:7px}</style>
<header><strong>jade<span style="color:#a5a3ff"> office</span></strong><span>共同編集</span><div class="grow"></div><button id="second">別の編集者を開く ↗</button></header>
<div class="bar"><strong id="document-name">demo.docx</strong><span id="identity" class="who">接続準備中</span><span id="status">読み込み中…</span><span id="peers"></span><div class="grow"></div><button id="connection" disabled>オフラインにする</button><a class="download" href="/documents/demo.docx" download="demo.docx">DOCXを保存 ↓</a></div>
<div id="notice" role="alert"></div>
<div class="tools"><strong>編集</strong><span>ページをクリックして入力</span><span>ドラッグ・Shift＋矢印で選択</span><span>Enterで行内改行</span><div class="grow"></div><span id="version"></span></div>
<main id="editor" role="group" aria-label="Word文書エディタ"><div id="loading">文書とフォントを読み込み中…</div></main>
<!-- The OS IME needs a focusable text input at the canvas caret. It stores
     only the current composition, never the document or paragraph layout. -->
<div id="ime" contenteditable="plaintext-only" role="textbox" aria-label="文書を編集" aria-multiline="true" spellcheck="false" autocapitalize="off"></div>
<footer>jade-office の Word 編集エンジンで直接編集 · 本文と表のセル内の文字・IME・コピー＆ペーストに対応。<br>段落・表の構造変更、書式変更、共同編集Undoはこのデモの対象外。オフライン中の変更はこのタブ内に保持されます。</footer>
<script type="module" src="/app.js"></script>
</html>
