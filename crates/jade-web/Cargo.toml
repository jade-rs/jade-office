[workspace]

[package]
name = "jade-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

# The engine's slide and sheet renderers on the pure-Rust tiny-skia painter:
# the same pixels natively and in `wasm32-unknown-unknown`. Natively it is a
# library plus a comparison bin; in the browser it is the wasm-bindgen API in
# `src/web.rs`, built with `scripts/build-web.sh`.

[lib]
name = "jade_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-docx-editor = { path = "../../jade-core/crates/jade-docx-editor" }
jade-docx-headless-api = { path = "../../jade-core/crates/jade-docx-headless-api" }
jade-selection = { path = "../../jade-core/crates/jade-selection" }
# The shaping measurer (rustybuzz) the native docx host measures with.
jade-docx-layout = { path = "../../jade-core/crates/jade-docx-layout", features = ["native-shaping"] }
futures = "0.3"
# The PDF of the pages (`pdf.rs`): their pixels, Flate-compressed.
flate2 = "1"
js-sys = "0.3"
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d"] }
jade-painter = { path = "../../jade-core/crates/jade-painter" }
jade-tiny-skia-painter = { path = "../jade-tiny-skia-painter" }
jade-office-model = { path = "../jade-office-model", features = ["tiny-skia"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

# The comparison bin reads the Skia PNGs back; native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# The Word glyph sweep (`src/bin/word_glyph_sweep.rs`): the documents' font
# names, the installed fonts that answer for them, the reference JSON and its
# source hashes.
jade-docx-reader = { path = "../../jade-core/crates/jade-docx-reader" }
jade-opc = { path = "../../jade-core/crates/jade-opc" }
fontdb = "0.23"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"


[dev-dependencies]
jade-opc = { path = "../../jade-core/crates/jade-opc" }
# Shift_JIS, for the CSV a Japanese Excel writes as a merge's list.
encoding_rs = "0.8"

# tiny-skia's anti-aliased rect fill debug-asserts when a thin rule's inner
# span comes out zero pixels wide, then skips it — what release builds do
# anyway. Debug builds and tests should not panic on it.
[profile.dev.package.tiny-skia]
debug-assertions = false

# The corpus tests lay out and paint every fixture; unoptimized engine crates
# make that minutes, not seconds.
[profile.dev.package."*"]
opt-level = 2
