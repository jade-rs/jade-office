[workspace]

[package]
name = "jade-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

# The engine's slide and sheet renderers on the pure-Rust tiny-skia painter:
# the same pixels natively and in `wasm32-unknown-unknown`. Natively it is a
# library plus a comparison bin; in the browser it is the wasm-bindgen API in
# `src/web.rs`, built with `scripts/build-web.sh`.

[lib]
name = "jade_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-opc = { path = "../../jade-core/crates/jade-opc" }
jade-painter = { path = "../../jade-core/crates/jade-painter" }
jade-pptx-layout = { path = "../../jade-core/crates/jade-pptx-layout" }
jade-pptx-reader = { path = "../../jade-core/crates/jade-pptx-reader" }
jade-pptx-render = { path = "../../jade-core/crates/jade-pptx-render" }
jade-tiny-skia-painter = { path = "../jade-tiny-skia-painter" }
jade-xlsx-layout = { path = "../../jade-core/crates/jade-xlsx-layout" }
jade-xlsx-reader = { path = "../../jade-core/crates/jade-xlsx-reader" }
jade-xlsx-render = { path = "../../jade-core/crates/jade-xlsx-render" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must match the wasm-bindgen CLI that generates the JS glue.
wasm-bindgen = "=0.2.128"
console_error_panic_hook = "0.1"

# The comparison bin reads the Skia PNGs back; native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
