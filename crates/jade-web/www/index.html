<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jade web prototype</title>
  <style>
    :root {
      --bg: #09090b; --panel: #0d0d0f; --border: #27272a; --text: #e4e4e7;
      --dim: #a1a1aa; --accent: #818cf8; --canvas: #141416;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 13px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 8px 14px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header .logo {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
    }
    header button, header label {
      background: transparent; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
    }
    header button:hover, header label:hover { background: #18181b; }
    #status { color: var(--dim); margin-left: auto; }
    main { flex: 1; display: flex; min-height: 0; }
    #thumbs {
      width: 190px; overflow-y: auto; padding: 8px; border-right: 1px solid var(--border);
      background: #0a0a0c; display: none;
    }
    #thumbs canvas { width: 100%; display: block; margin-bottom: 8px; border: 2px solid var(--border); cursor: pointer; }
    #thumbs canvas.active { border-color: var(--accent); }
    #stage { flex: 1; overflow: auto; background: var(--canvas); position: relative; }
    #stage canvas.slide { display: block; margin: 24px auto; box-shadow: 0 8px 24px #0008; }
    #sheet-spacer { position: absolute; top: 0; left: 0; pointer-events: none; }
    #sheet { position: sticky; top: 0; left: 0; display: block; }
    #tabs { display: none; gap: 2px; padding: 0 8px; border-top: 1px solid var(--border); background: var(--panel); }
    #tabs button { background: none; border: 0; color: var(--dim); padding: 6px 12px; font: inherit; cursor: pointer; }
    #tabs button.active { color: var(--accent); box-shadow: inset 0 -2px var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <strong>jade</strong>
    <label>ファイルを開く…<input id="file" type="file" accept=".pptx,.xlsx" hidden></label>
    <button data-sample="sample-deck.pptx">sample-deck.pptx</button>
    <button data-sample="themed-deck.pptx">themed-deck.pptx</button>
    <button data-sample="charts-workbook.xlsx">charts-workbook.xlsx</button>
    <span id="status">wasm を読み込み中…</span>
  </header>
  <main>
    <div id="thumbs"></div>
    <div id="stage"></div>
  </main>
  <div id="tabs"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
