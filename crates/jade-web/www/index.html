<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jade office</title>
  <style>
    :root { color-scheme: dark light; }
    html, body { margin: 0; height: 100%; background: #09090b; color: #a1a1aa;
      font: 13px -apple-system, "Hiragino Sans", sans-serif; overflow: hidden; }
    @media (prefers-color-scheme: light) {
      html, body { background: #ffffff; color: #64748b; }
    }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div id="loading">gpui を起動中…</div>
  <script>
    // The app's own store in the browser (IndexedDB): 自動回復's copies and
    // the Normal template — files, which localStorage cannot hold. Each call
    // answers with a promise.
    globalThis.jadeStore = (() => {
      let opened;
      const db = () => opened ??= new Promise((resolve, reject) => {
        const request = indexedDB.open("jade-office", 1);
        request.onupgradeneeded = () => {
          for (const name of ["recovery", "templates"]) {
            if (!request.result.objectStoreNames.contains(name)) {
              request.result.createObjectStore(name);
            }
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      const run = (store, mode, act) => db().then((base) => new Promise((resolve, reject) => {
        const request = act(base.transaction(store, mode).objectStore(store));
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      }));
      return {
        put: (store, key, value) => run(store, "readwrite", (s) => s.put(value, key)),
        get: (store, key) => run(store, "readonly", (s) => s.get(key)),
        remove: (store, key) => run(store, "readwrite", (s) => s.delete(key)),
        // Every record with its key.
        all: (store) => db().then((base) => new Promise((resolve, reject) => {
          const out = [];
          const request = base.transaction(store, "readonly").objectStore(store).openCursor();
          request.onsuccess = () => {
            const cursor = request.result;
            if (!cursor) return resolve(out);
            out.push({ key: cursor.key, ...cursor.value });
            cursor.continue();
          };
          request.onerror = () => reject(request.error);
        })),
      };
    })();
  </script>
  <script type="module">
    // The gpui app is the whole page. It lists SAMPLES in its explorer and
    // asks for files through the hooks below; every file comes back to it
    // through `open_file`. ?open=<sample> opens one at start.
    import init, { run, open_file } from "./gpui-pkg/jade_gpui_web.js";
    const SAMPLES = [
      "contract.docx",
      "char-effects.docx",
      "charts-workbook.xlsx",
      "grid-operations-workbook.xlsx",
      "sample-deck.pptx",
      "themed-deck.pptx",
      "poi-SmartArt.pptx",
      "poi-table_test2.pptx",
    ];
    const bytes = (url) => fetch(url).then((r) => {
      if (!r.ok) throw new Error(`${url}: ${r.status}`);
      return r.arrayBuffer();
    }).then((b) => new Uint8Array(b));
    const openFile = (file) =>
      file.arrayBuffer().then((buffer) => open_file(file.name, new Uint8Array(buffer)));

    // Save hands the bytes back; the page offers them as a download. A PDF
    // to print opens in a hidden frame, which prints it.
    const save = (fileName, data, print) => {
      if (print) {
        const url = URL.createObjectURL(new Blob([data], { type: "application/pdf" }));
        const frame = Object.assign(document.createElement("iframe"), { src: url });
        frame.style.display = "none";
        frame.addEventListener("load", () => frame.contentWindow?.print());
        document.body.append(frame);
        setTimeout(() => { frame.remove(); URL.revokeObjectURL(url); }, 60000);
        return;
      }
      const url = URL.createObjectURL(new Blob([data]));
      const link = Object.assign(document.createElement("a"), { href: url, download: fileName });
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    const load = (name) =>
      bytes(`samples/${name}`).then((data) => open_file(name, data)).catch(console.error);
    const picker = Object.assign(document.createElement("input"), {
      type: "file",
      accept: ".docx,.docm,.dotx,.dotm,.doc,.dot,.rtf,.txt,.odt,.htm,.html,.xlsx,.xlsm,.xltx,.xltm,.csv,.pptx,.pptm,.potx,.potm,.ppsx,.ppsm,.png,.jpg,.jpeg,.gif",
      multiple: true,
    });
    picker.addEventListener("change", () => {
      for (const file of picker.files) openFile(file);
      picker.value = "";
    });
    const pick = () => picker.click();
    // Files dropped anywhere on the page open as tabs.
    addEventListener("dragover", (event) => event.preventDefault());
    addEventListener("drop", (event) => {
      event.preventDefault();
      for (const file of event.dataTransfer?.files ?? []) openFile(file);
    });

    try {
      await init();
      const [regular, bold, thai] = await Promise.all([
        bytes("fonts/NotoSansJP-Regular.ttf"),
        bytes("fonts/NotoSansJP-Bold.ttf"),
        bytes("fonts/NotoSansThai.ttf"),
      ]);
      run(
        regular, bold, thai,
        window.devicePixelRatio || 1,
        Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC",
        navigator.language || "ja",
        SAMPLES,
        save, load, pick,
      );
      document.getElementById("loading").remove();
      const name = new URLSearchParams(location.search).get("open");
      if (name) load(name);
    } catch (error) {
      document.getElementById("loading").textContent = `起動に失敗: ${error}`;
      console.error(error);
    }
  </script>
</body>
</html>
