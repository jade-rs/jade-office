[workspace]

# The browser build of the shell: gpui-pre (a crates.io snapshot of Zed's
# gpui, which has a web platform) drawing slides and sheets that `jade-web`
# paints with the pure-Rust painter. Separate from `jade-gpui-app`, which
# stays on gpui 0.2 until the native app moves too.

[package]
name = "jade-gpui-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-web = { path = "../jade-web" }
jade-tiny-skia-painter = { path = "../jade-tiny-skia-painter" }
# The dark-paper colour mapping, for what the view draws over the pages.
jade-painter = { path = "../../jade-core/crates/jade-painter" }
image = { version = "0.25.1", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Single-threaded: the multithreaded default needs nightly (`wasm_thread`)
# and cross-origin isolation headers on the page.
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
wasm-bindgen = "=0.2.128"
console_error_panic_hook = "0.1"
futures = "0.3"
js-sys = "0.3"
# The asynchronous Clipboard API's promises (形式を選択して貼り付け).
wasm-bindgen-futures = "=0.4.78"

# gpui-pre-web 0.3.9 leaves the browser's IME textarea at (0, 0).
# Keep the platform fix local until an upstream release includes it.
[patch.crates-io]
gpui-pre-web = { path = "../../vendor/gpui-pre-web" }

# tiny-skia's anti-aliased rect fill debug-asserts when a thin rule's inner
# span comes out zero pixels wide, then skips it — what release builds do
# anyway. Debug builds and tests should not panic on it.
[profile.dev.package.tiny-skia]
debug-assertions = false
