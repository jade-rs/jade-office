[workspace]

# The browser build of the shell: gpui-pre (a crates.io snapshot of Zed's
# gpui, which has a web platform) drawing slides and sheets that `jade-web`
# paints with the pure-Rust painter. Separate from `jade-gpui-app`, which
# stays on gpui 0.2 until the native app moves too.

[package]
name = "jade-gpui-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jade-web = { path = "../jade-web" }
jade-tiny-skia-painter = { path = "../jade-tiny-skia-painter" }
image = { version = "0.25.1", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Single-threaded: the multithreaded default needs nightly (`wasm_thread`)
# and cross-origin isolation headers on the page.
gpui_web = { package = "gpui-pre-web", version = "=0.3.9", default-features = false }
wasm-bindgen = "=0.2.128"
console_error_panic_hook = "0.1"
futures = "0.3"
js-sys = "0.3"
