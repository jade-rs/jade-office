[workspace]

[package]
name = "jade-office-model"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

# The editing models both shells share: a workbook over jade-core's
# HeadlessWorkbook and a deck over the pptx EditSession, laid out and painted
# through whichever painter the shell brings. UI-free, so the native gpui app
# and the browser build run the same code; the backend is a feature:
#   skia       the native app's (jade-skia-painter; links Skia's C++)
#   tiny-skia  the browser build's (jade-tiny-skia-painter; pure Rust)

[lib]
name = "jade_office_model"
path = "src/lib.rs"

[features]
default = []
skia = ["dep:jade-skia-painter", "dep:jade-docx-native-render", "dep:lopdf", "jade-docx-convert/pdf"]
tiny-skia = ["dep:jade-tiny-skia-painter"]

[dependencies]
jade-docx-editor = { path = "../../jade-core/crates/jade-docx-editor" }
jade-docx-headless-api = { path = "../../jade-core/crates/jade-docx-headless-api" }
# Word's other formats: .doc, RTF, text, ODT, HTML (word::formats).
jade-docx-convert = { path = "../../jade-core/crates/jade-docx-convert" }
jade-doc-reader = { path = "../../jade-core/crates/jade-doc-reader" }
jade-doc-writer = { path = "../../jade-core/crates/jade-doc-writer" }
# Embedded fonts' obfuscation and licences (word::embedding).
jade-docx-reader = { path = "../../jade-core/crates/jade-docx-reader" }
# Placing the printed PDF's pages on sheets (word::printing, native only).
lopdf = { version = "=0.39.0", optional = true, default-features = false }
# 文書の比較 and 組み込み: the structural diff and the redline it merges into.
jade-docx-diff = { path = "../../jade-core/crates/jade-docx-diff" }
jade-docx-merge = { path = "../../jade-core/crates/jade-docx-merge" }
hypher = { version = "0.1", default-features = false, features = ["english"] }
# Salts for passwords (word::protection): the OS's random source, the
# browser's crypto.getRandomValues in wasm, where there is no clock.
getrandom = { version = "0.2", features = ["js"] }
# 署名欄: the signature line's picture.
png = "0.17"
zip = { version = "8", default-features = false, features = ["deflate"] }
jade-docx-layout = { path = "../../jade-core/crates/jade-docx-layout" }
jade-selection = { path = "../../jade-core/crates/jade-selection" }
jade-opc = { path = "../../jade-core/crates/jade-opc" }
jade-painter = { path = "../../jade-core/crates/jade-painter" }
jade-pptx-layout = { path = "../../jade-core/crates/jade-pptx-layout" }
jade-pptx-reader = { path = "../../jade-core/crates/jade-pptx-reader" }
jade-pptx-render = { path = "../../jade-core/crates/jade-pptx-render" }
jade-pptx-writer = { path = "../../jade-core/crates/jade-pptx-writer" }
jade-xlsx-headless-api = { path = "../../jade-core/crates/jade-xlsx-headless-api" }
jade-xlsx-calc = { path = "../../jade-core/crates/jade-xlsx-calc" }
ironcalc_base = { package = "jade-xlsx-calc-engine", path = "../../jade-core/third_party/ironcalc-base" }
jade-xlsx-headless-editor = { path = "../../jade-core/crates/jade-xlsx-headless-editor" }
jade-xlsx-layout = { path = "../../jade-core/crates/jade-xlsx-layout" }
jade-xlsx-reader = { path = "../../jade-core/crates/jade-xlsx-reader" }
jade-xlsx-render = { path = "../../jade-core/crates/jade-xlsx-render" }
jade-skia-painter = { path = "../../jade-core/crates/jade-skia-painter", optional = true }
jade-docx-native-render = { path = "../../jade-core/crates/jade-docx-native-render", optional = true }
jade-tiny-skia-painter = { path = "../jade-tiny-skia-painter", optional = true }
# Word's styles, lists and theme parts, rewritten in place (word/xml.rs), and
# the edited package read back (word/package.rs).
quick-xml = "0.39"
# Loading a .docx outside a renderer (word/package.rs, word::printing's
# selection).
futures = "0.3"
# An SVG picture's PNG fallback, drawn as Word stores one beside it.
resvg = { version = "0.45.1", default-features = false }
# Shift_JIS, for the CSV a Japanese Excel writes.
encoding_rs = "0.8"
# The browser build's PDF of page pictures, and the entries a damaged
# document's archive still has (word::repair).
flate2 = "1"
# Bringing pictures down to a resolution (word::compress).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
png = "0.17"
zip = { version = "8.0", default-features = false, features = ["deflate"] }
cfb = "0.7"

# tiny-skia's anti-aliased rect fill debug-asserts when a thin rule's inner
# span comes out zero pixels wide, then skips it — what release builds do
# anyway. Debug builds and tests should not panic on it.
[profile.dev.package.tiny-skia]
debug-assertions = false

# Corpus tools: save every file as the app saves it, and print it as the
# native app prints it, to set beside what Office makes of the same files.
[[example]]
name = "resave"
required-features = ["tiny-skia"]

[[example]]
name = "oracle_pdf"
required-features = ["skia"]

[[example]]
name = "resave_docx"
required-features = ["skia"]
