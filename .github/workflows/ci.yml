name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Debug info only slows the builds and bloats the caches; CI never reads it.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  word-capture-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Word capture verifier
        run: python -m pip install -r jade-core/scripts/word-oracle/requirements-borders.txt
      - name: Reject overwritten, changed, mismatched or incomplete Word captures
        run: python -m unittest discover -s scripts -p test_word_version_capture.py
      - name: Reject moved, missing, substituted or repaginated PDF glyphs
        run: python -m unittest discover -s scripts -p test_word_coordinate_comparison.py

  # Submodule workflows do not run for a jade-office PR. Keep the engine's
  # Mac coordinate gate explicit here as well; never refresh its snapshots.
  word-mac-coordinates:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: jade-core/crates/jade-docx-native-render
      - name: Verify unadjusted Word for Mac probe coordinates
        run: cargo test --manifest-path jade-core/crates/jade-docx-native-render/Cargo.toml --locked --test word_mac_coordinates --test word_windows_coordinates -- --test-threads=1

  # The native app and the crates that paint through Skia.
  native:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # The one rust-toolchain.toml pins.
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            crates/jade-gpui-app
            crates/jade-pptx-native-render
            crates/jade-office-model

      - name: Cargo fmt
        run: cargo fmt --manifest-path crates/jade-gpui-app/Cargo.toml -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path crates/jade-gpui-app/Cargo.toml --all-targets --locked -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path crates/jade-gpui-app/Cargo.toml --locked

      - name: PPTX native render (fmt, clippy, test)
        run: |
          cargo fmt --manifest-path crates/jade-pptx-native-render/Cargo.toml -- --check
          cargo clippy --manifest-path crates/jade-pptx-native-render/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path crates/jade-pptx-native-render/Cargo.toml --locked

      - name: Shared editing models (fmt, clippy, test on both backends)
        run: |
          cargo fmt --manifest-path crates/jade-office-model/Cargo.toml -- --check
          cargo clippy --manifest-path crates/jade-office-model/Cargo.toml --all-targets --features skia,tiny-skia --locked -- -D warnings
          cargo test --manifest-path crates/jade-office-model/Cargo.toml --features skia,tiny-skia --locked

  # The pure-Rust painter and the browser engine: no Skia, so Linux will do.
  # wasm32 is type-checked here; the Pages workflow does the optimized build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # The one rust-toolchain.toml pins.
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            crates/jade-tiny-skia-painter
            crates/jade-web
            crates/jade-office-model
            crates/jade-office-perf

      - name: Pure-Rust painter, web engine and perf harness (fmt, clippy, test)
        run: |
          for crate in jade-tiny-skia-painter jade-web jade-office-perf; do
            cargo fmt --manifest-path crates/$crate/Cargo.toml -- --check
            cargo clippy --manifest-path crates/$crate/Cargo.toml --all-targets --locked -- -D warnings
            cargo test --manifest-path crates/$crate/Cargo.toml --locked
          done

      - name: wasm32 (clippy for the web engine, check for the editing models)
        run: |
          cargo clippy --manifest-path crates/jade-web/Cargo.toml --lib --locked --target wasm32-unknown-unknown -- -D warnings
          cargo check --manifest-path crates/jade-office-model/Cargo.toml --features tiny-skia --locked --target wasm32-unknown-unknown

  # gpui-pre needs a newer stable than the app's toolchain; the crate pins
  # its own in crates/jade-gpui-web/rust-toolchain.toml, repeated in the env
  # so rust-cache keys on that rustc too.
  gpui-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/jade-gpui-web

      - name: gpui web shell (fmt, clippy for wasm32)
        working-directory: crates/jade-gpui-web
        run: |
          cargo fmt -- --check
          cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

  collaboration-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: demos/collaboration/renderer
      - name: Cursor projection and active presence regressions
        run: node --test demos/collaboration/editing.test.mjs demos/collaboration/presence.test.mjs
      - name: Word editor WASM bridge (fmt, clippy, build)
        run: |
          cargo +stable fmt --manifest-path demos/collaboration/renderer/Cargo.toml -- --check
          cargo +stable clippy --manifest-path demos/collaboration/renderer/Cargo.toml --target wasm32-unknown-unknown --release --locked --no-deps -- -D warnings
          cargo +stable build --manifest-path demos/collaboration/renderer/Cargo.toml --target wasm32-unknown-unknown --release --locked
