name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/jade-gpui-app

      - name: Cargo fmt
        run: cargo fmt --manifest-path crates/jade-gpui-app/Cargo.toml -- --check

      - name: Cargo clippy
        run: cargo clippy --manifest-path crates/jade-gpui-app/Cargo.toml --all-targets --locked -- -D warnings
