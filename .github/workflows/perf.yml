name: Perf

# Counts the instructions each `jade-office-perf` scenario executes — the
# browser build's renderers on the tiny-skia painter, at a Retina page's 2x —
# on the pull request's base and head, and comments the difference with the
# functions that moved. jade-core's own perf workflow paints into a painter
# that draws nothing, so rasterising is measured here or nowhere. Instruction
# counts from callgrind are close to deterministic, so unlike wall-clock
# timings on a shared runner they can be compared run to run.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FIXTURES: contract.docx char-effects.docx charts-workbook.xlsx sample-deck.pptx
  CARGO_INCREMENTAL: '0'

jobs:
  callgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: head
          submodules: recursive

      - name: Checkout base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          submodules: recursive

      # The one rust-toolchain.toml pins.
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: perf-ci
          workspaces: |
            head/crates/jade-office-perf -> target
            base/crates/jade-office-perf -> target

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Build head
        working-directory: head
        run: cargo build --manifest-path crates/jade-office-perf/Cargo.toml --profile perf-ci --locked

      # The base is measured with the head's harness so both sides run the
      # same scenarios. A harness that does not compile against the base
      # leaves the report head-only rather than failing the job.
      - name: Build base
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python3 head/scripts/perf/graft_harness.py head base
          cd base && cargo build --manifest-path crates/jade-office-perf/Cargo.toml --profile perf-ci

      - name: Measure
        run: |
          head/scripts/perf/run-callgrind.sh head/crates/jade-office-perf/target/perf-ci/jade-office-perf perf/head $FIXTURES
          if [ "${{ steps.base.outcome }}" = "success" ]; then
            # The head's script, run from the base checkout so it reads the
            # base's fixtures.
            mkdir -p base/scripts/perf
            cp head/scripts/perf/run-callgrind.sh base/scripts/perf/
            base/scripts/perf/run-callgrind.sh base/crates/jade-office-perf/target/perf-ci/jade-office-perf perf/base $FIXTURES
          fi

      - name: Report
        run: |
          python3 head/scripts/perf/compare.py perf/base perf/head \
            --base-label "base ${BASE_SHA::8}" --head-label "head ${HEAD_SHA::8}" > perf/summary.md
          cat perf/summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload callgrind outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-callgrind
          path: perf/
          if-no-files-found: warn

      # Forks get a read-only token; their report stays in the job summary.
      - name: Comment on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("perf/summary.md", "utf8");
            const header = body.split("\n", 1)[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(header));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
