name: Pages

# Builds the browser prototype (scripts/build-web.sh) and publishes
# crates/jade-web/www to GitHub Pages: the canvas page at / and the gpui
# shell at /gpui.html. Pull requests that touch the web build only build it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - scripts/build-web.sh
      - crates/jade-web/**
      - crates/jade-gpui-web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # The repository's toolchain for jade-web, and the newer one
      # crates/jade-gpui-web pins for gpui-pre.
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            crates/jade-web
            crates/jade-gpui-web

      # Must match the wasm-bindgen crate version both Cargo.lock files pin.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@0.2.128

      - name: Install wasm-opt
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_125/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./scripts/build-web.sh

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: crates/jade-web/www

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
